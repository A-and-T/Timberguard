<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request a Quote – TimberGuard</title>
	<!-- Favicon for desktop -->
	<link rel="icon" type="image/png" href="/images/favicon.png">

	<!-- Apple-specific touch icon -->
	<link rel="apple-touch-icon" href="/images/favicon.png">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f8f8f8;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 1.5rem;
    }

    form {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 1.5rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.25rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    button {
      background-color: #006b3c;
      color: white;
      font-weight: bold;
      border: none;
      margin-top: 1.5rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #004d2a;
    }

    @media (max-width: 480px) {
      body { padding: 1rem 0.5rem; }
      form { padding: 1rem; }
      input, select, textarea, button {
        font-size: 0.95rem;
        padding: 0.6rem;
      }
    }
  </style>
</head>
<body>
  <h1>Request a Free Gutter Quote</h1>
  <form id="quoteForm">
    <label for="name">Your Name:</label>
    <input type="text" name="name" required>

    <label for="email">Your Email:</label>
    <input type="email" name="email" required>

    <label for="phone">Phone Number:</label>
    <input type="tel" name="phone" required>

    <label for="address">Service Address:</label>
    <input id="addressInput" type="text" name="address" placeholder="Enter your address" required>

    <label for="service">Service Type:</label>
    <select name="service" required>
      <option value="">-- Select a service --</option>
      <option value="Gutter Installation">Gutter Installation</option>
      <option value="Gutter Cleaning">Gutter Cleaning</option>
      <option value="Gutter Guards">Gutter Guards</option>
      <option value="Soffit & Fascia">Soffit & Fascia</option>
    </select>

    <label for="contact">Preferred Contact Method:</label>
    <select name="contact" required>
      <option value="">-- Select contact method --</option>
      <option value="Email">Email</option>
      <option value="Phone">Phone</option>
    </select>

    <label for="notes">Additional Notes:</label>
    <textarea name="notes" rows="3"></textarea>

    <label for="date">Preferred Date:</label>
    <input type="date" name="date" required>

    <label for="slot">Available Time Slots:</label>
    <select name="slot" id="slotOptions" required>
      <option value="">-- Select a time --</option>
    </select>

    <button type="submit">Submit Request</button>
  </form>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwpKeaVUPQAWxO4BcQ5aM2ZfhAQrLvVtiH_d67_vUyDAHm1oNME0i3mtCsRTvoUuBo/exec';
	
	
    const form = document.getElementById('quoteForm');
    const dateInput = form.date;
    const slotSelect = document.getElementById('slotOptions');

    // Fetch available slots
    dateInput.addEventListener('change', () => {
      slotSelect.innerHTML = '<option>Loading...</option>';
      fetch(`${scriptURL}?action=getAvailableSlots&date=${dateInput.value}`)
        .then(res => res.json())
        .then(slots => {
          slotSelect.innerHTML = '';
          if (!slots.length) {
            slotSelect.innerHTML = '<option>No slots available</option>';
          } else {
            slots.forEach(slot => {
              const opt = document.createElement('option');
              opt.value = slot.startTime;
              opt.textContent = slot.label;
              slotSelect.appendChild(opt);
            });
          }
        })
        .catch(err => {
          console.error('Slot load error', err);
          slotSelect.innerHTML = '<option>Error loading slots</option>';
        });
    });

    // Submit the form
    form.addEventListener('submit', e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());

      fetch(scriptURL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
        .then(res => res.text())
        .then(msg => {
          alert(msg);
          form.reset();
          slotSelect.innerHTML = '<option>-- Select a time --</option>';
        })
        .catch(err => {
          console.error('Submit error', err);
          alert('There was an error. Please try again.');
        });
    });
  </script>
</body>
</html>
