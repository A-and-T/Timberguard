<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Appointment | TimberGuard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      color: #006b3c;
    }

    .button {
      background-color: #006b3c;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
    }

    .modal-content {
      position: relative;
      width: 90%;
      height: 90%;
      margin: 5vh auto;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    .modal-content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      background: none;
      color: #333;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Request an Appointment</h1>
  <p>Click the button below to get started:</p>
  <button class="button" onclick="openModal()">Open Request Form</button>

  <div id="formModal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">×</button>
      <iframe src="https://sites.google.com/view/request-quote?usp=sharing"></iframe>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById("formModal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("formModal").style.display = "none";
    }
  </script>

</body>
</html>
