
<!-- gallery.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - TimberGuard</title>
	<link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
	<link rel="canonical" href="https://timberguardgutters.com/gallery.html" />
</head>
<body>
	<div id="header"></div>

    <main class="container">
        <h1 class="title" id="gallery_title">Project Gallery...</h1>
        <p class="description" id="gallery_description">
            Take a look at our recent work. From full installations to clean, crisp finishes—every TimberGuard job reflects our commitment to quality!
        </p>
		<div class="gallery-grid" id="gallery"></div>
	</main>
  <div id="footer"></div>
</body>
<script>
  const imageFolder = 'images/gallery/';
  const totalImages = 200;            // max to scan
  const imageLimitPerBatch = 5;       // images per lazy load
  let currentImage = 0;
  const gallery = document.getElementById('gallery');

  function loadNextValidImageBatch() {
    let imagesToLoad = imageLimitPerBatch;

    function tryNextImage() {
      if (imagesToLoad <= 0 || currentImage > totalImages) return;

      const img = new Image();
      const imgSrc = `${imageFolder}img${currentImage}.jpg`;
      img.src = imgSrc;
      img.alt = `Gallery image ${currentImage}`;
      img.className = 'gallery-img';

      img.onload = () => {
        gallery.appendChild(img);
        imagesToLoad--;
        currentImage++;
        tryNextImage(); // load next if successful
      };

      img.onerror = () => {
        currentImage++;
        tryNextImage(); // skip and try next if not found
      };
    }

    tryNextImage();
  }

  // Lazy load more images when reaching the bottom
  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
      loadNextValidImageBatch();
    }
  });

  // Add sentinel trigger at bottom
  const sentinel = document.createElement('div');
  sentinel.style.height = '1px';
  gallery.after(sentinel);
  observer.observe(sentinel);

  // Initial load (IMPORTANT: only one entry point)
  loadNextValidImageBatch();
</script>




  <script src="js/content.js"></script>
  <script src="js/include.js"></script>
</html>
