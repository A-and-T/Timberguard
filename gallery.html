
<!-- gallery.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - TimberGuard</title>
	<link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
	<link rel="canonical" href="https://timberguardgutters.com/gallery.html" />
</head>
<body>
	<div id="header"></div>

    <main class="container">
        <h1 class="title" id="gallery_title">Project Gallery...</h1>
        <p class="description" id="gallery_description">
            Take a look at our recent work. From full installations to clean, crisp finishes—every TimberGuard job reflects our commitment to quality!
        </p>
		<div class="gallery-grid" id="gallery"></div>
	</main>
  <div id="footer"></div>
</body>
<script>
  const imageFolder = 'images/gallery/';
  const totalImages = 200;
  let currentIndex = 1;
  const imagesPerBatch = 5;

  const gallery = document.getElementById('gallery');

  function loadNextValidImageBatch() {
    let imagesLoaded = 0;

    function tryLoadNext() {
      if (currentIndex > totalImages || imagesLoaded >= imagesPerBatch) return;

      const img = new Image();
      const fileName = `${imageFolder}img${currentIndex}.jpg`;
      img.src = fileName;
      img.alt = `Gallery image ${currentIndex}`;
      img.className = 'gallery-img';

      img.onload = () => {
        gallery.appendChild(img);
        imagesLoaded++;
        currentIndex++;
        tryLoadNext(); // keep going until batch full
      };

      img.onerror = () => {
        currentIndex++;
        tryLoadNext(); // skip and keep trying next
      };
    }

    tryLoadNext();
  }

  // Load first batch
  loadNextValidImageBatch();

  // Observer to detect when bottom of page is visible
  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
      loadNextValidImageBatch();
    }
  });

  // Sentinel div to trigger loading more
  const sentinel = document.createElement('div');
  sentinel.style.height = '1px';
  gallery.after(sentinel);
  observer.observe(sentinel);
</script>


  <script src="js/content.js"></script>
  <script src="js/include.js"></script>
</html>
